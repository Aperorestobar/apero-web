<title>Pase de reserva · Apero</title>

<style>
:root{--ink:#0d0b09;--panel:#16130f;--line:#3a2f1f;--gold:#c9973f;--gold-hi:#e6c17a;--cream:#ece3d2;--muted:#a99c86;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--cream);font:16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ticket{width:min(380px,100%);background:var(--panel);border:1px solid var(--gold);border-radius:14px;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px dashed var(--gold)}
.top img{width:52px;height:52px;border-radius:4px}
.top small{display:block;color:var(--gold);letter-spacing:.2em;font-size:.68rem;font-weight:600;text-transform:uppercase}
.top b{font:600 1.5rem "Cormorant Garamond",Georgia,serif}
.qrbox{padding:22px;display:grid;justify-items:center;gap:10px}
#qr{background:#fff;padding:12px;border-radius:8px;width:232px;height:232px;display:grid;place-items:center}
#qr img,#qr canvas{width:208px;height:208px;display:block}
.code{font:500 1.6rem "Oswald","Arial Narrow",sans-serif;letter-spacing:.08em;color:var(--gold-hi)}
.hint{margin:0;color:var(--muted);font-size:.85rem;text-align:center;max-width:30ch}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;padding:18px 22px;border-top:1px dashed var(--gold);font-variant-numeric:tabular-nums}
dt{color:var(--muted);font-size:.85rem}
dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.actions{display:grid;gap:10px;padding:0 22px 22px}
.btn{display:block;text-align:center;padding:12px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-hi);text-decoration:none;font-weight:600}
.btn.solid{background:var(--gold);color:#1a1206}
.foot{padding:14px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:center}
.empty{padding:30px 22px;text-align:center;color:var(--muted)}
</style>
</head>

  const pad=x=>String(x).padStart(2,"0"), [h,m]=t.split(":").map(Number), e=h*60+m+120, dd=d.replace(/-/g,"");
  const gcal="https://calendar.google.com/calendar/render?"+new URLSearchParams({action:"TEMPLATE",text:"Apero Restobar · "+p+" "+T.people.toLowerCase(),dates:`${dd}T${pad(h)}${pad(m)}00/${dd}T${pad(Math.floor(e/60)%24)}${pad(e%60)}00`,ctz:"America/Santiago",location:"Apero Restobar, Av. Presidente Riesco 5330, local 101B, Las Condes",details:c}).toString();
  const acts=el("div","actions");
  [[T.cal,gcal,"btn solid"],[T.map,"https://www.google.com/maps/place/Apero/@-33.4034131,-70.5753142,19z","btn"],[T.wa,"https://wa.me/56963607900?text="+encodeURIComponent(c),"btn"]].forEach(([txt,href,cls])=>{ const a=el("a",cls,txt); a.href=href; a.target="_blank"; a.rel="noopener"; acts.appendChild(a); });
